name: Lecture bot 24/7

on:
  schedule:
    - cron: '*/30 * * * *'     # queues the next run; only one runs at a time
  workflow_dispatch:

concurrency:
  group: lecture-bot
  cancel-in-progress: false     # let the running job finish; the queued one takes over

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lecture.txt
      - name: Install
        run: |
          pip install -r requirements-lecture.txt
          playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-noto-core
      - name: Run bot (stops itself before the 6h job limit)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LECTURE_BOT_TOKEN: ${{ secrets.LECTURE_BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          TRANSLATOR_NAMES: ${{ vars.TRANSLATOR_NAMES }}
          STUDY_NOTES_DIR: /tmp/Study_Notes
        run: timeout 345m python lecture_worker.py || true
